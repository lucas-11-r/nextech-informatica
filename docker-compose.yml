# MySQL 8.4 para a loja NexTech.
# Uso: docker compose up -d   (ou docker-compose up -d, conforme sua instalação)
# As variáveis abaixo são lidas do .env, criado por `npm run setup`.

services:
  mysql:
    image: mysql:8.4
    container_name: nextech-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nextech}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-}
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-data:
